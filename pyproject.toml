[project]
name = "synix-memory"
version = "1.0.0"
description = "Programmable memory pipelines for AI agents — sessions to episodes to rollups to core memory, with full provenance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Huzaifa Aqeel" },
]
keywords = ["agent", "memory", "build-system", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "anthropic>=0.40,<1.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
semantic-search = [
    "fastembed>=0.4",
]
mesh = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
mcp = [
    "mcp[cli]>=1.0",
]
server = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "mcp[cli]>=1.0",
]
viewer = ["flask>=3.0"]

[project.scripts]
synix = "synix.cli.main:cli"

[project.urls]
Homepage = "https://github.com/HuzaifaAqeel/Synix-Memory"
Repository = "https://github.com/HuzaifaAqeel/Synix-Memory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synix"]
